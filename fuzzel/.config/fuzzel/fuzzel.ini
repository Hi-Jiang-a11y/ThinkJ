[main]
# Centered application launcher with a compact, readable result list.
icon-theme=Papirus-Dark
font=JetBrainsMono Nerd Font:size=11
prompt="Apps  "
terminal=kitty -e
anchor=bottom-right
width=65
lines=10
horizontal-pad=16
vertical-pad=10
inner-pad=8
line-height=20
letter-spacing=0.2
dpi-aware=auto

# Search
fields=name,exec
match-mode=fzf
sort-result=yes

[colors]
background=0b0b0df5
text=e7dfe8ff
prompt=ffb6c1ff
input=d8d2dcff
placeholder=958b98ff
match=ffb6c1ff
counter=958b98ff
selection=3d2935ff
selection-text=fff0f5ff
selection-match=ffd1dcff
border=b9788aff


[dmenu]
exit-immediately-if-empty=yes

[key-bindings]
 prev=Up Control+p
 next=Down Control+n

[border]
width=4
radius=10
