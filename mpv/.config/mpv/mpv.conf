# Rendering: native Wayland/OpenGL with AMD hardware decoding.
# This is more broadly reliable than forcing a Vulkan context.
vo=gpu
gpu-api=opengl
gpu-context=wayland
hwdec=auto-safe
hwdec-codecs=all

# Good image quality without expensive interpolation or shaders.
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell
deband=yes
deband-iterations=2
deband-threshold=35
deband-range=16
deband-grain=4
interpolation=no

# Playback behavior.
save-position-on-quit=yes
keep-open=yes
reset-on-next-file=pause
sub-auto=fuzzy
audio-file-auto=fuzzy

# Network playback: allow a useful read-ahead buffer without excessive RAM use.
cache=yes
demuxer-max-bytes=256MiB
demuxer-max-back-bytes=64MiB

# Keep MPV's interface minimal; the on-screen controller remains available.
osd-bar=no
osc=yes
border=no
