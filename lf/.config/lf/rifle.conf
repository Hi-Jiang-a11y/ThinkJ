cmd open &{{
    case "$(file --mime-type -Lb "$f")" in
        # images
        image/*)
            ~/.local/bin/swayimg-lf "$f"
            ;;
        # video
        video/*)
            mpv -- "$f"
            ;;
        # audio
        audio/*)
            mpv -- "$f"
            ;;
        # pdf / ebook
        application/pdf|application/epub+zip)
            zathura -- "$f"
            ;;
        # office documents
        application/vnd.openxmlformats-officedocument.*|\
        application/msword|\
        application/vnd.ms-excel)
            libreoffice -- "$f"
            ;;
        # text files
        text/*|inode/x-empty)
            lf -remote "send $id \$$EDITOR -p \$fx"
            ;;
        # archive
        application/zip|\
        application/x-tar|\
        application/x-7z-compressed|\
        application/x-rar)
            xdg-open "$f"
            ;;
        # directories
        inode/directory)
            cd "$f"
            ;;
        # executable
        application/x-executable|application/x-pie-executable)
            "$f"
            ;;
        # fallback
        *)
            xdg-open "$f"
            ;;
    esac
}}

cmd open_with %{{
    ~/.local/bin/openwith "$f" "$id"
}}
